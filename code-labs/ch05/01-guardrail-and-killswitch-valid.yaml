# Author: Kien Nguyen
# Chapter 05: External OPA/CEL Guardrails, RAG Filter & Kill Switch
apiVersion: orderflow.platform/v1
kind: OrderFlowGuardrailConfig
metadata:
  name: orderflow-runtime-guardrails
  namespace: orderflow-agent-platform
spec:
  enforcement_mode: "external_opa_cel"
  blocked_cli_tokens:
    - "rm -rf"
    - "kubectl delete"
    - "terraform destroy"
    - "--privileged"
  protected_host_paths:
    - "/var/run/docker.sock"
    - "/etc/shadow"
  rag_isolation:
    strip_embedded_instructions: true
    quarantine_html_comments: true
    tag_untrusted_context: true
  a2a:
    require_signed_envelope: true
    signature_algorithm: "ECDSA-SECP256R1-SHA256"
    max_clock_skew_seconds: 30
  kill_switch:
    enabled: true
    max_tool_calls_per_task: 12
    trip_on_violation_count: 3
    states:
      - ARMED
      - DEGRADED
      - TRIPPED
      - KILLED
