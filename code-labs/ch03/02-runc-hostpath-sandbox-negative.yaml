# Author: Kien Nguyen
# Negative control: shared runc + hostPath + privileged + low pool
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: unsafe-runc-hostpath-tmpl
  namespace: default
spec:
  runtimeClassName: "runc"
  template:
    spec:
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
      containers:
        - name: code-runner
          image: ghcr.io/orderflow/agent-runner:latest
          securityContext:
            privileged: true
---
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxWarmPool
metadata:
  name: undersized-warmpool
  namespace: default
spec:
  replicas: 1
  sandboxTemplateRef:
    name: unsafe-runc-hostpath-tmpl
---
apiVersion: agents.x-k8s.io/v1alpha1
kind: Sandbox
metadata:
  name: retired-v1alpha1-sandbox
  namespace: default
spec:
  runtimeClassName: "runc"
